<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPACE PROGRAM</title><link rel="icon" href="../rika-kids-icon.svg"><link rel="stylesheet" href="./style.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script></head>
<body>
<div id="viewport"></div>
<div id="boot"><div><b>SPACE PROGRAM</b><p>宇宙センターを起動中…</p><small id="boot-detail">3D環境・機体システムを初期化</small><p id="boot-error" style="display:none;color:#ffb2a8"></p></div></div>
<header class="top"><div class="brand">SPACE PROGRAM<small>KERBAL-STYLE SPACE FLIGHT</small></div><div class="resources">資金 <b id="funds">25,000</b>　科学 <b id="science">0</b></div><button id="home">宇宙センター</button></header>
<nav class="tabs"><button data-screen="center" class="active">宇宙センター</button><button data-screen="vab">ロケット組立棟</button><button data-screen="research">研究開発</button><button data-screen="contracts">ミッション</button><button data-screen="crew">乗組員</button></nav>
<aside id="parts" class="parts"><div class="parts-head"><b>PARTS CATALOG <small id="parts-count">0 PARTS</small></b><button id="close-parts">×</button></div><input id="part-search" class="part-search" placeholder="パーツ名を検索..." autocomplete="off"><div class="catalog-tools"><select id="part-sort"><option value="name">名前順</option><option value="mass">質量順</option><option value="cost">価格順</option><option value="size">サイズ順</option></select><span id="part-result-count"></span></div><div class="catalog-body"><nav id="part-categories" class="part-categories"></nav><div class="part-list" id="part-list"></div></div></aside>
<section id="career-panel" class="career-panel hidden"><div class="career-head"><b id="career-title">管理</b><button id="career-close">×</button></div><div id="career-content" class="career-content"></div></section>
<aside id="build-staging" class="build-staging"><div class="build-staging-head">STAGING</div><div id="build-stage-list"></div><button id="stage-add-side">＋ ステージ追加</button></aside>
<div class="vab-tools"><button id="launch" class="primary">▶ 発射</button><button id="save-craft">機体保存</button><button id="load-craft">読み込み</button><button id="clear-craft">全パーツ削除</button><button id="new-stage">＋ ステージ追加</button><span id="stage-build-label">組立ステージ 0</span><span id="craft-name">無題の機体</span></div>
<div class="bottom-hint" id="hint">宇宙センター：ロケット組立棟で機体を設計し、発射場から宇宙へ。</div>
<div id="flight-hud" class="flight-hud"><div class="stage-stack"><b>STAGING</b><div id="stage-list"></div><button id="stage-next">STAGE ▶</button></div><div class="flight-left"><b id="altitude">高度 0 m</b><span id="speed">速度 0 m/s</span><span id="vertical">垂直速度 0 m/s</span><span id="apo">遠点 --</span><span id="peri">近点 --</span><span id="mission-time">T+00:00</span></div><div class="navball"><div class="navball-sky"></div><div class="navball-mark">＋</div><b id="heading">HDG 090°</b></div><div class="flight-right"><b id="throttle">スロットル 0%</b><span id="fuel">燃料 100%</span><span id="stage-label">ステージ 0</span><span id="gforce">G 1.0</span><button id="map-toggle">マップ M</button><button id="science-experiment">科学実験</button></div></div>
<div id="toast"></div>
<script>
(function(){
 const showBootError=function(message){
  const detail=document.getElementById('boot-detail');
  const error=document.getElementById('boot-error');
  if(detail)detail.textContent='起動に失敗しました';
  if(error){error.style.display='block';error.textContent=String(message||'不明なエラー');}
 };
 window.addEventListener('error',function(e){showBootError(e.message||'JavaScript読み込みエラー');});
 window.addEventListener('unhandledrejection',function(e){showBootError(e.reason&&e.reason.message||e.reason||'モジュール読み込みエラー');});
 window.setTimeout(function(){
  const boot=document.getElementById('boot');
  if(boot&&getComputedStyle(boot).display!=='none'&&!document.getElementById('boot-error').textContent)
   showBootError('初期化が完了しません。ページを再読み込みしてください。');
 },12000);
})();
</script>
<script type="module" src="./game.js?v=20261122-3"></script>
</body></html>
