<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space Program 3D</title><link rel="icon" href="../rika-kids-icon.svg"><link rel="stylesheet" href="./style.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script></head><body><div id="viewport"></div><div id="boot"><div><b>SPACE PROGRAM</b><p>宇宙センターを起動中…</p><small id="boot-detail">3D環境・機体システムを初期化</small></div></div>
