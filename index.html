<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16834a">
<meta name="description" content="中学3年生向けの理科用語集。化学・物理・生物・地学の重要語句とイオン式を掲載。">
<title>理科キッズ｜中学3年 理科用語集</title>
<style>
:root{--green:#16834a;--dark:#0d6537;--pale:#eaf6ee;--ink:#202a24;--muted:#69766e;--line:#e4ebe6;--bg:#f5f8f5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif;line-height:1.75}
.site-header{background:#fff;border-bottom:1px solid var(--line)}.header-inner{max-width:1100px;margin:auto;padding:15px 24px;display:flex;align-items:center;gap:13px}
.logo{width:46px;height:46px;border-radius:5px;background:#168b4c;color:white;display:grid;place-items:center;font-size:29px;font-weight:900;box-shadow:inset 0 -3px 0 #0d6d3a}
.brand{font-size:23px;font-weight:850;color:#1d3426}.brand small{display:block;font-size:10px;letter-spacing:.16em;color:#839087;line-height:1.2}.header-tag{margin-left:auto;color:#678071;font-size:12px;font-weight:700;background:#f0f7f2;padding:7px 12px;border-radius:30px}
main{max-width:1100px;margin:auto;padding:30px 24px 75px}.hero{background:linear-gradient(115deg,#e7f5eb,#f5faf6 70%);border:1px solid #d8ebde;border-radius:18px;padding:27px 32px;margin-bottom:23px;position:relative;overflow:hidden}.hero:after{content:"理";position:absolute;right:35px;top:-38px;font-size:180px;font-weight:900;color:#16834a0e;pointer-events:none}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--green);font-weight:850}h1{font-size:clamp(25px,4vw,34px);line-height:1.35;margin:7px 0}.hero p{margin:0;color:#617168;font-size:14px}.stats{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}.stat{background:#fff;border:1px solid #e1eee4;border-radius:9px;padding:6px 12px;font-size:12px;color:#65736a}.stat b{font-size:16px;color:var(--green);margin-right:4px}
.toolbar{display:flex;gap:12px;align-items:center;margin:19px 0 12px;flex-wrap:wrap}.search-wrap{flex:1;min-width:220px;position:relative}.search-wrap span{position:absolute;left:14px;top:7px;color:#849188;font-size:20px}#search{width:100%;height:43px;border:1px solid #dce5de;border-radius:10px;background:white;padding:0 14px 0 42px;font:inherit;font-size:14px;outline:none}#search:focus{border-color:var(--green);box-shadow:0 0 0 3px #16834a18}
.filters{display:flex;gap:6px;flex-wrap:wrap}.filter{border:1px solid #dce6df;background:#fff;color:#647269;border-radius:30px;padding:7px 12px;font:inherit;font-size:12px;font-weight:750;cursor:pointer}.filter.active,.filter:hover{background:var(--green);border-color:var(--green);color:white}
.section-heading{display:flex;align-items:end;justify-content:space-between;margin:24px 0 12px}.section-heading h2{font-size:19px;margin:0}#count{font-size:12px;color:#7a877e}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.term-card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px 17px}.term-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}.category{font-size:10px;font-weight:800;color:var(--green);background:var(--pale);padding:2px 8px;border-radius:5px}.term-card h3{font-size:16px;margin:0}.term-card p{font-size:13px;color:#59665e;margin:0}.formula{display:inline-block;font-family:ui-monospace,Consolas,monospace;font-size:13px;font-weight:750;color:#155d35;background:#f0f7f2;border:1px solid #e1eee4;border-radius:5px;padding:1px 7px;margin-left:auto}.no-results{grid-column:1/-1;text-align:center;padding:40px;background:white;border:1px dashed #d8e3db;border-radius:12px;color:#7b887f}
.note{margin-top:23px;padding:14px 18px;border-radius:10px;background:white;border:1px solid var(--line);font-size:12px;color:#6c796f}.note b{color:#385744}
footer{background:#fff;border-top:1px solid var(--line);color:#8a968e}.footer-inner{max-width:1100px;margin:auto;padding:20px 24px;display:flex;align-items:center;gap:12px;font-size:11px}.footer-mark{font-weight:800;color:#61756a}.secret-button{margin-left:auto;width:23px;height:23px;border:0;background:transparent;color:#d5ded7;border-radius:50%;cursor:pointer;font-size:11px;opacity:.55}.secret-button:hover,.secret-button:focus-visible{opacity:1;background:#eaf6ee;color:var(--green);outline:2px solid #b7ddc3}
.secret-screen{position:fixed;inset:0;background:#0c1c12f5;z-index:10;display:none;align-items:center;justify-content:center;padding:24px;color:white;text-align:center}.secret-screen.show{display:flex}.secret-panel{max-width:440px}.secret-panel .mark{width:58px;height:58px;margin:0 auto 18px;background:var(--green);display:grid;place-items:center;font-size:35px;font-weight:900;border-radius:7px}.secret-panel h2{font-size:27px;margin:0 0 8px}.secret-panel p{color:#c5d5ca;font-size:14px;margin:0 0 22px}.close-secret{background:#fff;color:#174b2e;border:0;border-radius:8px;padding:10px 22px;font:inherit;font-weight:800;cursor:pointer}
@media(max-width:650px){.header-inner{padding:12px 16px}.header-tag{font-size:10px;padding:6px 8px}main{padding:20px 15px 50px}.hero{padding:22px 19px}.hero:after{right:8px;font-size:130px}.cards{grid-template-columns:1fr}.footer-inner{padding:17px 15px}}
</style>
</head>
<body>
<header class="site-header"><div class="header-inner"><div class="logo" aria-label="理">理</div><div class="brand">理科キッズ<small>SCIENCE KIDS</small></div><div class="header-tag">中学3年生・理科用語集</div></div></header>
<main>
<section class="hero"><div class="eyebrow">WELCOME TO SCIENCE KIDS</div><h1>理科の言葉を、<br>わかりやすく。</h1><p>中学3年生で学ぶ理科の重要用語・意味・化学式をまとめました。</p><div class="stats"><div class="stat"><b id="total">70</b>掲載用語</div><div class="stat"><b>4</b>学習分野</div><div class="stat">検索・分野別表示に対応</div></div></section>
<div class="toolbar"><div class="search-wrap"><span>⌕</span><input id="search" type="search" placeholder="用語・化学式・説明から検索…" autocomplete="off" aria-label="用語を検索"></div><div class="filters" aria-label="分野で絞り込み"><button class="filter active" data-category="すべて">すべて</button><button class="filter" data-category="化学">化学</button><button class="filter" data-category="物理">物理</button><button class="filter" data-category="生物">生物</button><button class="filter" data-category="地学">地学</button></div></div>
<div class="section-heading"><h2>理科用語一覧</h2><span id="count"></span></div><section class="cards" id="cards" aria-live="polite"></section>
<div class="note"><b>学習のポイント</b><br>用語の意味だけでなく、化学式や実験での使い方も確認してみましょう。※学校や教科書によって学習する順番・扱う範囲は異なります。</div>
</main>
<footer><div class="footer-inner"><span class="footer-mark">■ 理科キッズ</span><span>中学3年 理科 学習用サイト</span><button class="secret-button" id="secretButton" aria-label="隠しボタン">●</button></div></footer>
<div class="secret-screen" id="secretScreen" role="dialog" aria-modal="true" aria-labelledby="secretTitle"><div class="secret-panel"><div class="mark">理</div><h2 id="secretTitle">秘密の入口を発見！</h2><p>ここから先には、まだ誰も知らない世界がある……。<br>ゲームエリアは準備中です。</p><button class="close-secret" id="closeSecret">学習ページに戻る</button></div></div>
<script>
const terms=[
["化学","原子","物質をつくる基本的な粒子。原子核と電子からできている。"],
["化学","原子核","原子の中心にある部分。陽子と中性子からできている。"],
["化学","陽子","原子核をつくる粒子。＋の電気を帯びている。"],
["化学","中性子","原子核をつくる粒子。電気を帯びていない。"],
["化学","電子","原子核のまわりに存在する、－の電気を帯びた粒子。"],
["化学","イオン","原子や原子の集まりが電子を失ったり受け取ったりして、電気を帯びた粒子。"],
["化学","陽イオン","原子などが電子を失い、＋の電気を帯びたイオン。"],
["化学","陰イオン","原子などが電子を受け取り、－の電気を帯びたイオン。"],
["化学","電離","物質が水に溶けて、陽イオンと陰イオンに分かれること。"],
["化学","電解質","水に溶けると電離し、その水溶液に電流が流れる物質。"],
["化学","非電解質","水に溶けても電離せず、その水溶液に電流が流れない物質。"],
["化学","塩化ナトリウム","水に溶けるとナトリウムイオンと塩化物イオンに分かれる物質。","NaCl"],
["化学","塩化銅","水に溶けると銅イオンと塩化物イオンに分かれる物質。","CuCl₂"],
["化学","塩酸","塩化水素が水に溶けた水溶液。水中で水素イオンなどに電離する。","HCl"],
["化学","水酸化ナトリウム","水に溶けるとナトリウムイオンと水酸化物イオンに電離する物質。","NaOH"],
["化学","水素イオン","水素原子が電子を失ってできる陽イオン。","H⁺"],
["化学","ナトリウムイオン","ナトリウム原子が電子を1個失ってできる陽イオン。","Na⁺"],
["化学","銅イオン","銅原子が電子を2個失ってできる陽イオン。","Cu²⁺"],
["化学","亜鉛イオン","亜鉛原子が電子を2個失ってできる陽イオン。","Zn²⁺"],
["化学","銀イオン","銀原子が電子を1個失ってできる陽イオン。","Ag⁺"],
["化学","アンモニウムイオン","アンモニアなどに関係する、＋の電気を帯びた多原子イオン。","NH₄⁺"],
["化学","塩化物イオン","塩素原子が電子を1個受け取ってできる陰イオン。","Cl⁻"],
["化学","水酸化物イオン","酸性・アルカリ性に関係する陰イオン。","OH⁻"],
["化学","硫酸イオン","硫酸が電離してできる、2－の電気を帯びた陰イオン。","SO₄²⁻"],
["化学","硝酸イオン","硝酸が電離してできる、－の電気を帯びた陰イオン。","NO₃⁻"],
["化学","炭酸イオン","炭酸に関係する、2－の電気を帯びた陰イオン。","CO₃²⁻"],
["化学","中和","酸性の水溶液とアルカリ性の水溶液が互いの性質を打ち消し合う反応。"],
["化学","酸","水溶液中で水素イオンを生じる物質。青色リトマス紙を赤色に変える。"],
["化学","アルカリ","水溶液中で水酸化物イオンを生じる物質。赤色リトマス紙を青色に変える。"],
["化学","水素","最も軽い気体。火を近づけると音を立てて燃える。","H₂"],
["化学","酸素","ものを燃やすはたらきを助ける気体。","O₂"],
["化学","水","水素と酸素からできている物質。","H₂O"],
["化学","二酸化炭素","石灰水を白くにごらせる気体。","CO₂"],
["化学","化学変化","別の物質に変わる変化。"],
["化学","化学反応式","化学変化を化学式と矢印を使って表した式。"],
["化学","電気分解","電流を流して物質を分解する化学変化。"],
["化学","電池","化学変化によって電気エネルギーを取り出す装置。"],
["物理","仕事","物体に力を加え、その力の向きに動かしたときの量。"],
["物理","仕事率","一定時間あたりにする仕事の大きさ。単位はワット（W）。"],
["物理","仕事の原理","道具を使っても、摩擦などを考えなければ仕事の大きさは変わらないという考え方。"],
["物理","エネルギー","ほかの物体に仕事をする能力。"],
["物理","位置エネルギー","高いところにある物体が、その位置によってもつエネルギー。"],
["物理","運動エネルギー","運動している物体がもつエネルギー。"],
["物理","力学的エネルギー","位置エネルギーと運動エネルギーの和。"],
["物理","エネルギー保存の法則","エネルギーは形を変えても、全体の量は変わらないという法則。"],
["物理","力","物体の運動の状態や形を変えるはたらき。"],
["物理","摩擦力","物体が接している面に沿って、運動をさまたげる向きにはたらく力。"],
["物理","仕事の単位","仕事の単位はジュール（J）。1Jは1Nの力で1m動かしたときの仕事。"],
["物理","電力","1秒あたりに使う電気エネルギー。単位はワット（W）。"],
["物理","電力量","使った電気エネルギーの量。単位にはジュール（J）やキロワット時（kWh）がある。"],
["物理","熱量","移動した熱エネルギーの量。単位はジュール（J）。"],
["物理","放射線","物質を通り抜けたり、物質を電離させたりするはたらきをもつ高速の粒子や電磁波。"],
["物理","放射能","放射線を出す能力。"],
["物理","原子力発電","核分裂で発生する熱を利用して発電する方法。"],
["生物","遺伝","親の形質が子や孫の世代へ受け継がれること。"],
["生物","形質","生物がもつ形や性質などの特徴。"],
["生物","遺伝子","遺伝情報を伝えるもとになる、DNAの特定の部分。"],
["生物","DNA","遺伝情報を記録している物質。"],
["生物","染色体","細胞の核の中にあり、DNAなどからできている構造。"],
["生物","体細胞分裂","1つの細胞が分裂して、同じ染色体数をもつ2つの細胞になること。"],
["生物","生殖","生物が自分と同じ種類の新しい個体をつくること。"],
["生物","有性生殖","卵や精子などの生殖細胞が受精して新しい個体ができる生殖。"],
["生物","無性生殖","受精を行わずに新しい個体ができる生殖。"],
["生物","受精","卵の核と精子の核が合体すること。"],
["生物","生殖細胞","有性生殖に関係する卵や精子などの細胞。"],
["生物","減数分裂","生殖細胞がつくられるとき、染色体数が半分になる細胞分裂。"],
["生物","進化","生物の特徴が長い時間をかけて世代を超えて変化すること。"],
["生物","自然選択","環境に適した形質をもつ個体が生き残り、子孫を残しやすいこと。"],
["地学","プレート","地球の表面をおおう、十数枚に分かれた厚い岩石の板。"],
["地学","地震","地下の岩盤が急にずれ動くことで起こるゆれ。"],
["地学","震源","地下で地震が発生した場所。"],
["地学","震央","震源の真上にあたる地表の地点。"],
["地学","初期微動","地震のとき、初めに伝わる小さなゆれ。"],
["地学","主要動","初期微動のあとに伝わる大きなゆれ。"],
["地学","P波","初期微動を起こす、速く伝わる地震波。"],
["地学","S波","主要動を起こす、P波より遅く伝わる地震波。"],
["地学","火山","地下のマグマが地表に噴き出す場所や、その活動でできた山。"],
["地学","マグマ","地下にある高温で溶けた岩石。"],
["地学","火成岩","マグマが冷え固まってできた岩石。"],
["地学","火山岩","マグマが地表付近で急に冷え固まってできた火成岩。"],
["地学","深成岩","マグマが地下深くでゆっくり冷え固まってできた火成岩。"],
["地学","気団","気温や湿度がほぼ一様な空気のかたまり。"],
["地学","前線","性質の異なる気団どうしの境界付近。"],
["地学","温暖前線","暖かい気団が冷たい気団の上にはい上がって進む前線。"],
["地学","寒冷前線","冷たい気団が暖かい気団の下にもぐりこんで進む前線。"],
["地学","低気圧","周囲より気圧が低いところ。北半球では地表付近の風が反時計回りに吹き込む。"],
["地学","高気圧","周囲より気圧が高いところ。北半球では地表付近の風が時計回りに吹き出す。"],
["地学","偏西風","中緯度地域の上空で、西から東へ吹く風。"],
["地学","湿度","空気中に含まれる水蒸気量の、飽和水蒸気量に対する割合。"]
];
const cards=document.getElementById('cards'),search=document.getElementById('search'),count=document.getElementById('count'),filters=[...document.querySelectorAll('.filter')];
document.getElementById('total').textContent=terms.length;
let category='すべて';
function render(){
 const q=search.value.trim().toLowerCase();
 const found=terms.filter(t=>(category==='すべて'||t[0]===category)&&t.join(' ').toLowerCase().includes(q));
 count.textContent=found.length+'件の用語';
 cards.innerHTML=found.length?found.map(t=>'<article class="term-card"><div class="term-top"><span class="category">'+t[0]+'</span><h3>'+t[1]+'</h3>'+(t[3]?'<span class="formula">'+t[3]+'</span>':'')+'</div><p>'+t[2]+'</p></article>').join(''):'<div class="no-results">該当する用語がありません。</div>';
}
search.addEventListener('input',render);
filters.forEach(b=>b.addEventListener('click',()=>{category=b.dataset.category;filters.forEach(x=>x.classList.toggle('active',x===b));render()}));
render();
const screen=document.getElementById('secretScreen');document.getElementById('secretButton').addEventListener('click',()=>screen.classList.add('show'));document.getElementById('closeSecret').addEventListener('click',()=>screen.classList.remove('show'));document.addEventListener('keydown',e=>{if(e.key==='Escape')screen.classList.remove('show')});
</script>
</body></html>
