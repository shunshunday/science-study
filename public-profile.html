<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16834a">
<title>プレイヤープロフィール｜理科キッズ</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px;background:#f2f7f3;color:#203128;font-family:"Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif}
main{width:min(100%,620px);margin:0 auto}.card{background:#fff;border:1px solid #dfebe2;border-radius:20px;padding:26px;box-shadow:0 12px 35px #153d2510}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#203128;font-weight:900;margin-bottom:24px}.logo{width:42px;height:42px;display:grid;place-items:center;background:#16834a;color:#fff;border-radius:8px;font-size:27px}
h1{font-size:25px;margin:0 0 5px}.lead{font-size:13px;color:#718077;margin:0 0 20px}
.identity{display:flex;align-items:center;gap:17px;padding:18px;background:#f3f8f4;border-radius:14px}.avatar{width:82px;height:82px;flex:none;border-radius:50%;overflow:hidden;background:#16834a;color:#fff;display:grid;place-items:center;font-size:34px;font-weight:900;border:3px solid #dcebe0}.avatar img{width:100%;height:100%;object-fit:cover}.username{font-size:23px;font-weight:950;overflow-wrap:anywhere}.title{margin-top:5px;color:#65756b;font-size:13px;font-weight:800}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.stat{padding:15px;border:1px solid #e3ebe5;border-radius:11px}.stat span{display:block;color:#718077;font-size:11px;font-weight:800}.stat strong{display:block;margin-top:5px;font-size:22px;color:#16834a}
a.action{display:block;text-align:center;text-decoration:none;border-radius:10px;padding:13px;margin-top:13px;font-size:14px;font-weight:850}.primary{background:#16834a;color:#fff}.secondary{background:#eef5f0;color:#28613d}
#status{text-align:center;color:#69776e;padding:28px 8px;font-size:13px}.error{color:#a33}
@media(max-width:420px){.card{padding:20px}.avatar{width:66px;height:66px}.username{font-size:19px}}
</style>
</head>
<body>
<main>
<section class="card">
<a class="brand" href="./"><span class="logo">理</span><span>理科キッズ</span></a>
<h1>プレイヤープロフィール</h1><p class="lead">ランキングからプレイヤーのプロフィールを見ています。</p>
<div id="status">プロフィールを読み込んでいます…</div>
<div id="profile" hidden>
 <div class="identity"><div class="avatar" id="avatar">理</div><div><div class="username" id="username"></div><div class="title" id="title"></div></div></div>
 <div class="stats">
  <div class="stat"><span>現在の資産</span><strong id="balance">$0</strong></div>
  <div class="stat"><span>累計プレイ時間</span><strong id="playtime">0分</strong></div>
 </div>
 <a class="action primary" id="cityLink" href="#">🌆 このプレイヤーの都市を見る</a>
 <a class="action secondary" href="./ranking.html">ランキングに戻る</a>
</div>
<a class="action secondary" href="./">ホームに戻る</a>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabase=window.supabase.createClient("https://tmgfcmzufamxuzsuedza.supabase.co","sb_publishable_2hmdBWipev_2go57lH7wdA_fpHAP-Ng");
function titleFor(n){if(n>=100000)return "覇者";if(n>=50000)return "ノーベル賞";if(n>=20000)return "伝説の科学者";if(n>=10000)return "科学の天才";if(n>=6000)return "理科博士";if(n>=3000)return "理科マスター";if(n>=1000)return "理科チャレンジャー";return "理科ビギナー";}
function playtime(s){const m=Math.floor(Math.max(0,Number(s)||0)/60),h=Math.floor(m/60);return h?h+"時間"+m%60+"分":m+"分";}
(async()=>{
 const username=new URLSearchParams(location.search).get("user")||"";
 if(!username){document.getElementById("status").textContent="プレイヤーが指定されていません。";return;}
 const {data,error}=await supabase.rpc("get_public_player",{p_username:username});
 if(error||!data){document.getElementById("status").innerHTML="プロフィールを読み込めませんでした。";return;}
 document.title=data.username+"のプロフィール｜理科キッズ";
 document.getElementById("username").textContent=data.username;
 const assets=Math.max(0,Number(data.balance)||0);
 document.getElementById("balance").textContent="$"+assets.toLocaleString("en-US");
 document.getElementById("title").textContent=titleFor(assets);
 document.getElementById("playtime").textContent=playtime(data.playtime_seconds);
 if(data.avatar_url){const img=document.createElement("img");img.src=data.avatar_url;img.alt="";img.onerror=()=>img.remove();document.getElementById("avatar").textContent="";document.getElementById("avatar").appendChild(img);}
 const cityLink=document.getElementById("cityLink");
 cityLink.href="./city.html?view=1&user="+encodeURIComponent(data.username);
 if(!data.city_state){cityLink.textContent="まだ都市が作られていません";cityLink.removeAttribute("href");cityLink.style.opacity=".55";cityLink.style.pointerEvents="none";}
 document.getElementById("status").hidden=true;document.getElementById("profile").hidden=false;
})();
</script>
</body></html>
