<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16834a"><title>アカウント｜理科キッズ</title><style>:root{--green:#16834a;--line:#e4ebe6}*{box-sizing:border-box}body{margin:0;background:#f4f8f5;color:#202a24;font-family:"Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif;line-height:1.75}.site-header{background:#fff;border-bottom:1px solid var(--line)}.header-inner{max-width:1100px;margin:auto;padding:15px 24px;display:flex;align-items:center;gap:13px}.home-brand{display:flex;align-items:center;gap:13px;text-decoration:none;color:inherit}.logo{width:46px;height:46px;border-radius:5px;background:#168b4c;color:white;display:grid;place-items:center;font-size:29px;font-weight:900}.brand{font-size:23px;font-weight:850;color:#1d3426}.brand small{display:block;font-size:10px;letter-spacing:.16em;color:#839087;line-height:1.2}.header-tag{margin-left:auto;color:#678071;font-size:12px;font-weight:700;background:#f0f7f2;padding:7px 12px;border-radius:30px}.account-page{min-height:calc(100vh - 78px);display:flex;justify-content:center;padding:48px 18px}.account-modal{display:none;position:fixed;inset:0;z-index:1000;align-items:center;justify-content:center;padding:18px}.account-modal.open{display:flex}.account-backdrop{position:absolute;inset:0;background:#071b10b8;backdrop-filter:blur(3px)}.account-card{position:relative;width:min(100%,430px);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:28px;box-shadow:0 20px 70px #0003}.account-close{position:absolute;right:15px;top:12px;border:0;background:transparent;font-size:28px;color:#738078;cursor:pointer}.account-brand{display:flex;align-items:center;gap:10px;font-weight:900;color:#244331;margin-bottom:18px}.account-logo,.profile-avatar{display:grid;place-items:center;background:#168b4c;color:#fff;font-weight:900;border-radius:7px;width:38px;height:38px;font-size:24px}.account-card h2{margin:0 0 5px;font-size:23px}.account-lead,.profile-caption{font-size:12px;color:#69776e;margin:0 0 16px}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:#eef5f0;padding:4px;border-radius:10px;margin:16px 0}.auth-tab{border:0;background:transparent;border-radius:8px;padding:9px;font:inherit;font-size:13px;font-weight:800;color:#607168;cursor:pointer}.auth-tab.active{background:#fff;color:#16834a;box-shadow:0 1px 5px #0001}#authForm label{display:block;font-size:12px;font-weight:800;color:#405348;margin:12px 0 5px}#authForm input{width:100%;height:44px;border:1px solid #dce6df;border-radius:9px;padding:0 12px;font:inherit;outline:none}#authForm input:focus{border-color:#168b4c;box-shadow:0 0 0 3px #168b4a18}.auth-submit{width:100%;margin-top:17px;border:0;border-radius:9px;background:#168b4c;color:#fff;padding:12px;font:inherit;font-weight:850;cursor:pointer}.auth-submit:disabled{opacity:.55;cursor:wait}.auth-message{min-height:22px;font-size:12px;color:#b13b2e;margin:10px 0 0}.auth-note{font-size:11px;color:#7b887f;text-align:center;margin:8px 0 0}.profile-user{display:flex;align-items:center;gap:12px;background:#f4f8f5;border-radius:12px;padding:14px;margin:18px 0}.profile-user strong,.profile-user small{display:block}.profile-user small{font-size:11px;color:#7a877f}.profile-avatar{width:48px;height:48px;border-radius:50%;font-size:27px}.profile-score{background:#edf7ef;border:1px solid #dceee1;border-radius:13px;padding:20px;text-align:center}.profile-score strong{display:block;font-size:42px;line-height:1.2;color:#16834a}.profile-score span{font-size:13px;font-weight:800;color:#486451}.profile-rank{margin:12px 0 16px;padding:12px;border:1px solid #e8dfb8;background:#fffaf0;border-radius:11px;text-align:center}.profile-rank span{display:block;color:#8a7131;font-size:11px;font-weight:800}.profile-rank strong{display:block;color:#6e5316;font-size:19px;margin-top:3px}.profile-caption{margin:12px 0 0}.profile-view-haki .profile-user{background:linear-gradient(110deg,#21102f,#451638);border:1px solid #9846c5}.profile-view-haki .profile-avatar{background:linear-gradient(145deg,#7b32ad,#210d35);box-shadow:0 0 16px #c22cff}.profile-view-haki .profile-score{background:linear-gradient(135deg,#28113e,#45163f);border:1px solid #9b4ad0;box-shadow:0 0 18px #b42cff55}.profile-view-haki .profile-score strong{color:#f2caff;text-shadow:0 0 12px #d82cff}.profile-view-haki .profile-rank{background:linear-gradient(120deg,#29113e,#481638);border:1px solid #b44be0;box-shadow:0 0 20px #a42dce66}.profile-view-haki .profile-rank strong{color:#ffd4f0;font-size:23px;text-shadow:0 0 10px #ff2995}.profile-view-haki #profileHeading{color:#f5d9ff}.profile-view-haki .profile-user strong{color:#fff}.profile-view-haki .profile-user small{color:#d8c1e8}.profile-view-nobel .profile-user{background:linear-gradient(110deg,#fff8df,#f5e7bd);border:1px solid #d4b45e}.profile-view-nobel .profile-avatar{background:linear-gradient(145deg,#f7e5a5,#a87b24);color:#49350d;box-shadow:0 3px 12px #a87b2440}.profile-view-nobel .profile-score{background:linear-gradient(135deg,#fff8df,#f3e3b5);border:1px solid #d5b65f;box-shadow:inset 0 1px #fff}.profile-view-nobel .profile-score strong{color:#9b711e}.profile-view-nobel .profile-rank{background:linear-gradient(120deg,#fff8df,#f1dfaa);border:1px solid #c6a34c;box-shadow:0 5px 18px #a9822a22}.profile-view-nobel .profile-rank strong{color:#755315;font-size:23px}.profile-view-nobel #profileHeading{color:#805d1d}.profile-honors{display:none;text-align:center;color:#a27a28;font-size:11px;font-weight:900;letter-spacing:.16em;margin:-8px 0 10px}.profile-view-nobel .profile-honors{display:block}.profile-view-gold:not(.profile-view-haki):not(.profile-view-nobel) .profile-user{background:linear-gradient(110deg,#fff8cf,#f2d45c);border:1px solid #c89413}.profile-view-gold:not(.profile-view-haki):not(.profile-view-nobel) .profile-avatar{background:linear-gradient(145deg,#f7e5a5,#a87b24);color:#49350d;box-shadow:0 3px 12px #a87b2440}.profile-view-gold:not(.profile-view-haki):not(.profile-view-nobel) .profile-score{background:linear-gradient(135deg,#fff8df,#f3e3b5);border:1px solid #d5b65f}.profile-view-gold:not(.profile-view-haki):not(.profile-view-nobel) .profile-score strong{color:#9b711e}.profile-page-link{display:block;margin-top:12px;text-align:center;padding:10px;border-radius:9px;background:#eef5f0;color:#28613d;text-decoration:none;font-size:13px;font-weight:800}.account-setup{margin-top:14px;padding:12px;background:#fff5e6;color:#80531b;border-radius:9px;font-size:12px}
.account-card{width:min(100%,430px);max-height:none;overflow:visible}@media(max-width:650px){.header-inner{padding:12px 16px}.header-tag{font-size:10px;padding:6px 8px}.account-page{padding:25px 14px}}</style></head><body><header class="site-header"><div class="header-inner"><a class="home-brand" href="./"><div class="logo">理</div><div class="brand">理科キッズ<small>SCIENCE KIDS</small></div></a><div class="header-tag">アカウント</div></div></header><main class="account-page">

 <section class="account-card" aria-labelledby="accountTitle">

  <div class="account-brand"><span class="account-logo">理</span><span>理科キッズ</span></div>
  <div id="authView">
   <h2 id="accountTitle">アカウント</h2>
   <p class="account-lead">理科キッズ専用のユーザー名とパスワードで利用できます。</p>
   <div class="auth-tabs"><button type="button" class="auth-tab active" data-auth-tab="login">ログイン</button><button type="button" class="auth-tab" data-auth-tab="signup">新規登録</button></div>
   <form id="authForm">
    <label for="authUsername">ユーザー名</label><input id="authUsername" name="username" autocomplete="username" minlength="3" maxlength="20" required placeholder="3〜20文字の英数字・_・-">
    <label for="authPassword">パスワード</label><input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="8" required placeholder="8文字以上">
    <button class="auth-submit" id="authSubmit" type="submit">ログイン</button>
   </form>
   <p class="auth-message" id="authMessage" role="status" aria-live="polite"></p>
   <p class="auth-note">メールアドレスやGoogleアカウントは不要です。</p>
  </div>
  <div id="profileView" hidden>
   <h2 id="profileHeading">マイプロフィール</h2>
   <div class="profile-honors">✦ SCIENCE HONORS · NOBEL LEVEL ✦</div>
   <div class="profile-user"><div class="profile-avatar">理</div><div><strong id="profileUsername">ユーザー</strong><small>理科キッズ メンバー</small></div></div>
   <div class="profile-score"><strong id="profileMoney">$0</strong><span>資産（都市の所持金）</span></div>
   <div class="profile-rank"><span>現在の称号</span><strong id="profileRank">理科ビギナー</strong></div>
   <p class="profile-caption">都市の所持金を表示します。街づくりで使った資金や返金も反映されます。</p>
   <a class="auth-submit" style="display:block;text-align:center;text-decoration:none" href="profile.html">プロフィールページを開く</a>
   <a class="profile-page-link" href="./profile.html">マイページを開く</a><button class="auth-submit" id="logoutButton" type="button">ログアウト</button>
   <p class="auth-message" id="profileMessage" role="status"></p>
  </div>
  <p class="account-setup" id="accountSetup" hidden>アカウント機能の接続設定がまだ完了していません。管理者によるデータベース接続が必要です。</p>
 </section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const supabaseClient=window.supabase.createClient("https://tmgfcmzufamxuzsuedza.supabase.co","sb_publishable_2hmdBWipev_2go57lH7wdA_fpHAP-Ng");let authMode="login";const authView=document.getElementById("authView"),profileView=document.getElementById("profileView"),authMessage=document.getElementById("authMessage");function setAuthMode(mode){authMode=mode;document.querySelectorAll(".auth-tab").forEach(b=>b.classList.toggle("active",b.dataset.authTab===mode));document.getElementById("authSubmit").textContent=mode==="login"?"ログイン":"新規登録";document.getElementById("authPassword").autocomplete=mode==="login"?"current-password":"new-password";authMessage.textContent="";}document.querySelectorAll(".auth-tab").forEach(b=>b.addEventListener("click",()=>setAuthMode(b.dataset.authTab)));function usernameEmail(u){return u.toLowerCase()+"@accounts.rikakids.invalid";}function scienceTitle(n){if(n>=100000)return "覇者";if(n>=50000)return "ノーベル賞";if(n>=20000)return "伝説の科学者";if(n>=10000)return "科学の天才";if(n>=6000)return "理科博士";if(n>=3000)return "理科マスター";if(n>=1000)return "理科チャレンジャー";return "理科ビギナー";}async function refreshAccount(){const {data:{session}}=await supabaseClient.auth.getSession();if(!session){authView.hidden=false;profileView.hidden=true;return;}authView.hidden=true;profileView.hidden=false;const {data:p,error}=await supabaseClient.from("profiles").select("username").eq("id",session.user.id).single();if(error){document.getElementById("profileMessage").textContent="プロフィールを読み込めません。";return;}document.getElementById("profileUsername").textContent=p.username;const wr=await supabaseClient.rpc("get_city_wallet");if(wr.error)throw wr.error;const wallet=Array.isArray(wr.data)?wr.data[0]:wr.data;document.getElementById("profileMoney").textContent="$"+Number(wallet?.balance||0).toLocaleString("en-US");const assets=Math.max(0,Number(wallet?.balance)||0);document.getElementById("profileRank").textContent=scienceTitle(assets);profileView.classList.toggle("profile-view-nobel",assets>=50000&&assets<100000);profileView.classList.toggle("profile-view-haki",assets>=100000);profileView.classList.toggle("profile-view-gold",assets>=10000);}document.getElementById("authForm").addEventListener("submit",async e=>{e.preventDefault();const u=document.getElementById("authUsername").value.trim(),p=document.getElementById("authPassword").value;if(!/^[a-zA-Z0-9_-]{3,20}$/.test(u)){authMessage.textContent="ユーザー名は半角英数字・_・-の3〜20文字にしてください。";return;}if(p.length<8){authMessage.textContent="パスワードは8文字以上にしてください。";return;}const b=document.getElementById("authSubmit");b.disabled=true;authMessage.textContent="処理しています…";try{if(authMode==="signup"){const {data,error}=await supabaseClient.auth.signUp({email:usernameEmail(u),password:p,options:{data:{username:u}}});if(error)throw error;if(!data.session){authMessage.textContent="登録できました。管理者側でメール確認を無効にする必要があります。";return;}}else{const {error}=await supabaseClient.auth.signInWithPassword({email:usernameEmail(u),password:p});if(error)throw error;}authMessage.textContent="";await refreshAccount();}catch(err){authMessage.textContent=authMode==="signup"?"登録できませんでした。ユーザー名が使用済みか、設定を確認してください。":"ログインできません。ユーザー名とパスワードを確認してください。";}finally{b.disabled=false;}});document.getElementById("logoutButton").addEventListener("click",async()=>{await supabaseClient.auth.signOut();await refreshAccount();});supabaseClient.auth.onAuthStateChange(()=>setTimeout(refreshAccount,0));refreshAccount();</script></body></html>
