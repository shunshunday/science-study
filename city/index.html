<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#263b35"><title>City Builder 3D</title><link rel="icon" href="../rika-kids-icon.svg"><link rel="stylesheet" href="./style.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script></head>
<body><div id="viewport"></div><div id="boot"><div class="boot-card"><b>CITY SIMULATION</b><p>3D都市を準備しています…</p><small id="boot-detail">地形・水面・交通シミュレーションを初期化中</small></div></div>
<header class="top"><div class="brand"><span class="brand-mark">C</span><span><b>CITY BUILDER</b><small>都市開発シミュレーション</small></span></div><div class="city-stats"><span>人口 <b id="population">0</b></span><span>資金 <b id="money">₡0</b></span><span>収支 <b id="income">₡0</b></span><span>需要 <b id="demand">住宅 ▰ 商業 ▰ 産業 ▰</b></span></div><div class="top-actions"><button id="pause">Ⅱ</button><button id="speed">▶ 1x</button><button id="save">保存</button><button id="settings">⚙</button></div></header>
<nav class="left-rail"><button data-tab="build" class="active" title="建設">▦</button><button data-tab="district" title="区画">▤</button><button data-tab="services" title="公共サービス">✚</button><button data-tab="economy" title="経済">¥</button><button data-tab="views" title="情報ビュー">◉</button></nav>
<aside id="panel" class="panel"><div class="panel-head"><b id="panel-title">建設</b><button id="close-panel">×</button></div><div id="panel-content"></div></aside>
<div class="bottom-hud"><div class="tool-status"><i></i><span id="tool-status">選択ツール</span></div><div class="camera-pad"><button data-pan="up">▲</button><div><button data-pan="left">◀</button><button data-pan="down">▼</button><button data-pan="right">▶</button></div></div><div class="zoom"><button id="zoom-in">＋</button><button id="zoom-out">－</button></div><div class="hint">矢印キー：カメラ移動　ホイール：ズーム　建設モードで道路をクリック</div></div>
<div id="toast"></div><script type="module" src="./game.js"></script></body></html>
