<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#202a32"><link rel="icon" href="../rika-kids-icon.svg" type="image/svg+xml"><title>Coastline City | 都市開発シミュレーター</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#202a32;color:#e8edf0;font:14px/1.45 Arial,"Noto Sans JP",sans-serif;overflow:hidden}.top{height:54px;background:#171e24;display:flex;align-items:center;padding:0 18px;gap:22px;border-bottom:1px solid #46515a}.brand{font-size:18px;font-weight:700;letter-spacing:.5px}.brand span{color:#80c7a2}.stats{display:flex;gap:20px;color:#d7e0e4}.stats b{color:#fff}.spacer{flex:1}.toolrow{height:52px;background:#29343d;display:flex;align-items:center;padding:6px 12px;gap:7px;border-bottom:1px solid #53616a}.tool{background:#394750;border:1px solid #596973;color:#edf3f5;border-radius:4px;padding:8px 12px;cursor:pointer}.tool.active,.tool:hover{background:#477b68;border-color:#8cc7a8}.layout{display:grid;grid-template-columns:1fr 300px;height:calc(100vh - 106px)}#world{display:none}#city3d{position:absolute;inset:0 300px 0 0;width:auto;height:100%;display:block;cursor:grab}.layout{position:relative}.layout>aside{position:relative;z-index:2}.side{background:#26323a;border-left:1px solid #56636a;padding:14px;overflow:auto}.side h3{font-size:15px;margin:4px 0 12px}.panel{background:#34434c;border:1px solid #52616a;border-radius:5px;padding:12px;margin-bottom:12px}.muted{color:#aebbc1;font-size:12px}.metric{display:flex;justify-content:space-between;margin:7px 0}.bar{height:7px;background:#1c262c;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:#83c6a0;width:65%}button,select,input{font:inherit}button:disabled{opacity:.35}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.actions button{background:#455b65;color:white;border:0;padding:8px;border-radius:4px;cursor:pointer}.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:#c4d0d4}.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}@media(max-width:760px){#city3d{right:0}.layout{grid-template-columns:1fr}.side{display:none}.stats{gap:8px;font-size:11px}.top{padding:0 8px}.toolrow{overflow:auto}.tool{white-space:nowrap}}
</style></head><body>
<header class="top"><div class="brand">COASTLINE <span>CITY</span></div><div class="stats"><span>資金 <b id="cash">₡ 50,000</b></span><span>人口 <b id="pop">0</b></span><span>幸福度 <b id="happy">72%</b></span><span>収支 <b id="flow">₡ 0/週</b></span></div><div class="spacer"></div><button class="tool" id="pause">Ⅱ 一時停止</button></header>
<nav class="toolrow"><button class="tool active" data-mode="camera">選択・カメラ</button><button class="tool" data-mode="road">道路</button><button class="tool" data-mode="res">住宅区画</button><button class="tool" data-mode="com">商業区画</button><button class="tool" data-mode="ind">産業区画</button><button class="tool" data-mode="power">電力</button><button class="tool" data-mode="water">水道</button><button class="tool" data-mode="bulldoze">撤去</button><button class="tool" id="save">保存</button><button class="tool" id="load">読込</button></nav>
<main class="layout"><canvas id="world"></canvas><div id="city3d"></div><aside class="side"><h3 id="tooltitle">都市の概要</h3><section class="panel"><div class="metric"><span>都市レベル</span><b id="level">小さな集落</b></div><div class="metric"><span>住民</span><b id="people">0人</b></div><div class="metric"><span>住宅需要</span><b id="demand">低</b></div><div class="metric"><span>雇用</span><b id="jobs">0</b></div><div class="metric"><span>電力供給</span><b id="pwr">0 / 0 MW</b></div><div class="bar"><i id="pbar"></i></div><div class="metric"><span>水道供給</span><b id="wat">0 / 0 k㎥</b></div><div class="bar"><i id="wbar"></i></div></section>
<section class="panel"><h3>都市予算</h3><div class="metric"><span>税率</span><b id="taxval">9%</b></div><input id="tax" type="range" min="1" max="20" value="9" style="width:100%"><div class="metric"><span>サービス予算</span><b>標準 100%</b></div><div class="muted">税率を上げると収入は増えますが、住民の幸福度が下がります。</div></section>
<section class="panel"><h3>建設・サービス</h3><div class="actions"><button id="plant">発電所 ₡12,000</button><button id="pump">給水ポンプ ₡8,000</button><button id="fire">消防署 ₡15,000</button><button id="clinic">診療所 ₡18,000</button><button id="school">学校 ₡20,000</button><button id="loan">融資 ₡25,000</button></div></section>
<section class="panel"><h3>選択中</h3><div id="selection" class="muted">地面をクリックして区画や道路を配置。道路は道路モードで2点をクリックして敷設します。</div></section>
<div class="legend"><span><i class="dot" style="background:#72b98a"></i>住宅</span><span><i class="dot" style="background:#e4c46d"></i>商業</span><span><i class="dot" style="background:#bd866c"></i>産業</span><span><i class="dot" style="background:#6d9bd1"></i>道路</span></div><p class="muted">カメラ: 矢印キー / 画面ドラッグ。ホイールでズーム。建設は選択したモード中だけ行われます。</p></aside></main>
<script>
(()=>{
const c=document.getElementById('world'),ctx=c.getContext('2d');let W=0,H=0,cam={x:0,y:0,z:1},mode='camera',paused=false,roadStart=null,drag=null,selected=null;
const S=24,grid=new Map(),roads=[],buildings=[],services=[],trees=[];let cash=50000,pop=0,happy=72,tax=9,week=0,power=0,water=0,sim=0;
const key=(x,y)=>x+','+y,cell=(x,y)=>grid.get(key(x,y)),set=(x,y,o)=>grid.set(key(x,y),o);
function resize(){const r=c.getBoundingClientRect();W=c.width=Math.floor(r.width*devicePixelRatio);H=c.height=Math.floor(r.height*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=r.width;H=r.height;draw()}window.addEventListener('resize',resize);
function screen(x,y){return{x:W/2+(x-cam.x)*S*cam.z,y:H/2+(y-cam.y)*S*cam.z}}
function world(px,py){return{x:Math.round((px-W/2)/(S*cam.z)+cam.x),y:Math.round((py-H/2)/(S*cam.z)+cam.y)}}
function road(a,b){let dx=Math.sign(b.x-a.x),dy=Math.sign(b.y-a.y),x=a.x,y=a.y,n=0;while((x!==b.x||y!==b.y)&&n++<100){if(!cell(x,y))set(x,y,{type:'road'});if(x!==b.x)x+=dx;if(y!==b.y)y+=dy}if(!cell(b.x,b.y))set(b.x,b.y,{type:'road'});cash-=Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y))*90}
function zone(p,t){if(cell(p.x,p.y)||!nearRoad(p.x,p.y))return;set(p.x,p.y,{type:t});cash-=80}
function nearRoad(x,y){for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)if(cell(x+a,y+b)?.type==='road')return true;return false}
function addService(type,cost){if(cash<cost)return;cash-=cost;services.push({type,x:Math.round(cam.x),y:Math.round(cam.y)});if(type==='power')power+=35;if(type==='water')water+=35}
function place(p){if(mode==='road'){if(!roadStart){roadStart=p;document.getElementById('selection').textContent='道路の始点を選択中。終点をクリックしてください。'}else{road(roadStart,p);roadStart=null}}else if(['res','com','ind'].includes(mode))zone(p,mode);else if(mode==='bulldoze'){grid.delete(key(p.x,p.y));cash+=10}else if(mode==='power'||mode==='water')addService(mode,mode==='power'?12000:8000);selected=p;update()}
function draw(){if(!W)return;ctx.clearRect(0,0,W,H);ctx.fillStyle='#77a5a1';ctx.fillRect(0,0,W,H);
const left=cam.x-W/(2*S*cam.z)-2,right=cam.x+W/(2*S*cam.z)+2,top=cam.y-H/(2*S*cam.z)-2,bottom=cam.y+H/(2*S*cam.z)+2;
for(let y=Math.floor(top);y<bottom;y++)for(let x=Math.floor(left);x<right;x++){let p=screen(x,y);ctx.fillStyle=((x*7+y*11)%9===0)?'#80aaa0':'#79a69c';ctx.fillRect(p.x-S*cam.z/2,p.y-S*cam.z/2,S*cam.z,S*cam.z);ctx.strokeStyle='rgba(230,245,230,.09)';ctx.strokeRect(p.x-S*cam.z/2,p.y-S*cam.z/2,S*cam.z,S*cam.z)}
for(const [k,o] of grid){let [x,y]=k.split(',').map(Number),p=screen(x,y),z=S*cam.z;if(p.x<-z||p.x>W+z||p.y<-z||p.y>H+z)continue;
if(o.type==='road'){ctx.fillStyle='#525f65';ctx.fillRect(p.x-z*.5,p.y-z*.5,z,z);ctx.strokeStyle='#d2c78c';ctx.setLineDash([5*cam.z,5*cam.z]);ctx.beginPath();ctx.moveTo(p.x-z*.45,p.y);ctx.lineTo(p.x+z*.45,p.y);ctx.stroke();ctx.setLineDash([])}
else{ctx.fillStyle=o.type==='res'?'#70b887':o.type==='com'?'#e1c16c':'#bc846a';ctx.fillRect(p.x-z*.44,p.y-z*.44,z*.88,z*.88);ctx.fillStyle='rgba(255,255,255,.23)';ctx.fillRect(p.x-z*.32,p.y-z*.32,z*.64,z*.16);ctx.fillStyle='rgba(25,40,43,.28)';ctx.fillRect(p.x-z*.35,p.y+z*.12,z*.7,z*.25)}
}
for(const s of services){let p=screen(s.x,s.y);ctx.fillStyle=s.type==='power'?'#f4d65f':s.type==='water'?'#75d9e8':'#eee';ctx.beginPath();ctx.arc(p.x,p.y,7*cam.z,0,7);ctx.fill()}
if(roadStart){let p=screen(roadStart.x,roadStart.y);ctx.strokeStyle='#fff';ctx.strokeRect(p.x-10,p.y-10,20,20)}
}
c.addEventListener('click',e=>{if(drag?.moved){drag=null;return}const r=c.getBoundingClientRect(),p=world(e.clientX-r.left,e.clientY-r.top);if(mode==='camera'){selected=p;document.getElementById('selection').textContent='座標 '+p.x+', '+p.y+'。道路や区画の近くを選択できます。'}else place(p);draw()});
c.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!drag)return;if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>4)drag.moved=true;if(drag.moved){cam.x=drag.cx-(e.clientX-drag.x)/(S*cam.z);cam.y=drag.cy-(e.clientY-drag.y)/(S*cam.z);draw()}});c.addEventListener('pointerup',()=>{if(drag&&!drag.moved)drag=null;else drag=null});
c.addEventListener('wheel',e=>{e.preventDefault();cam.z=Math.max(.45,Math.min(2.4,cam.z*(e.deltaY<0?1.12:.89)));draw()},{passive:false});
window.addEventListener('keydown',e=>{let d=14/cam.z;if(e.key==='ArrowUp')cam.y-=d;if(e.key==='ArrowDown')cam.y+=d;if(e.key==='ArrowLeft')cam.x-=d;if(e.key==='ArrowRight')cam.x+=d;draw()});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;roadStart=null;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('tooltitle').textContent=b.textContent;document.getElementById('selection').textContent=mode==='road'?'道路の始点と終点を順にクリック。': '選択した場所をクリックして配置。';});
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'▶ 再開':'Ⅱ 一時停止'};
document.getElementById('tax').oninput=e=>{tax=+e.target.value;document.getElementById('taxval').textContent=tax+'%'};
document.getElementById('plant').onclick=()=>addService('power',12000);document.getElementById('pump').onclick=()=>addService('water',8000);
for(const id of ['fire','clinic','school'])document.getElementById(id).onclick=()=>addService(id, id==='fire'?15000:id==='clinic'?18000:20000);
document.getElementById('loan').onclick=()=>{cash+=25000;document.getElementById('selection').textContent='融資 ₡25,000 を受けました。返済残高 ₡25,000。'};
document.getElementById('save').onclick=()=>localStorage.setItem('coastline-city-save',JSON.stringify({grid:[...grid],services,cash,pop,happy,tax,week}));
document.getElementById('load').onclick=()=>{let d=JSON.parse(localStorage.getItem('coastline-city-save')||'null');if(d){grid.clear();d.grid.forEach(([k,v])=>grid.set(k,v));services.splice(0,services.length,...d.services);cash=d.cash;pop=d.pop;happy=d.happy;tax=d.tax;week=d.week;update();draw()}};
function update(){const zones=[...grid.values()].filter(v=>['res','com','ind'].includes(v.type));const houses=zones.filter(v=>v.type==='res').length;const com=zones.filter(v=>v.type==='com').length,ind=zones.filter(v=>v.type==='ind').length;const capacity=houses*12;pop=Math.max(0,Math.min(capacity,Math.floor((houses*9+com*2+ind*2)*(happy/100))));const jobs=com*8+ind*14;document.getElementById('cash').textContent='₡ '+Math.floor(cash).toLocaleString();document.getElementById('pop').textContent=pop.toLocaleString();document.getElementById('people').textContent=pop+'人';document.getElementById('happy').textContent=Math.round(happy)+'%';document.getElementById('jobs').textContent=jobs;document.getElementById('demand').textContent=houses<4?'高':houses<12?'中':'低';document.getElementById('level').textContent=pop<100?'小さな集落':pop<500?'村':pop<1500?'町':'都市';document.getElementById('pwr').textContent=power+' / '+Math.ceil((houses+com+ind)*.6)+' MW';document.getElementById('wat').textContent=water+' / '+Math.ceil((houses+com+ind)*.4)+' k㎥';document.getElementById('pbar').style.width=Math.min(100,power/Math.max(1,(houses+com+ind)*.6)*100)+'%';document.getElementById('wbar').style.width=Math.min(100,water/Math.max(1,(houses+com+ind)*.4)*100)+'%';document.getElementById('flow').textContent='₡ '+Math.round(pop*tax*.55- services.length*35).toLocaleString()+'/週'}
function tick(){if(!paused){sim++;if(sim%12===0){week++;let zones=[...grid.values()].filter(v=>['res','com','ind'].includes(v.type));let res=zones.filter(v=>v.type==='res').length,com=zones.filter(v=>v.type==='com').length,ind=zones.filter(v=>v.type==='ind').length;let growth=Math.min(res*12-pop,Math.floor((com*3+ind*2)*Math.max(.1,happy/100)));pop=Math.max(0,pop+growth);cash+=pop*tax*.5-zones.length*2-services.length*35;happy=Math.max(25,Math.min(98,72-(tax-9)*1.2+(power>0?2:0)+(water>0?2:0)));if(cash<0)happy-=1;update()}if(sim%4===0){draw()}}requestAnimationFrame(tick)}
resize();update();tick();
})();
</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const host=document.getElementById('city3d');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ec7d2);scene.fog=new THREE.Fog(0x9ec7d2,90,260);
const camera=new THREE.PerspectiveCamera(48,1,.1,700);camera.position.set(48,52,64);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;host.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.48;controls.minDistance=15;controls.maxDistance=150;
scene.add(new THREE.HemisphereLight(0xdff4ff,0x66745b,2));const sun=new THREE.DirectionalLight(0xfff0d2,3.2);sun.position.set(-45,80,35);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const water=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({color:0x397f9c,roughness:.2,metalness:.18,transparent:true,opacity:.94}));water.rotation.x=-Math.PI/2;water.position.y=-.35;scene.add(water);
const landGeo=new THREE.PlaneGeometry(160,160,100,100);landGeo.rotateX(-Math.PI/2);const pos=landGeo.attributes.position;
for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i);const edge=Math.max(Math.abs(x),Math.abs(z));let h=Math.max(0,Math.sin(x*.045)*1.4+Math.cos(z*.052)*1.2+Math.sin((x+z)*.028)*1.8);h+=Math.max(0,Math.sin(x*.12+z*.08))*Math.max(0,1-edge/80)*2;pos.setY(i,edge>68?-1.2:h)}
landGeo.computeVertexNormals();const land=new THREE.Mesh(landGeo,new THREE.MeshStandardMaterial({color:0x78a66e,roughness:1}));land.receiveShadow=true;scene.add(land);
const grid=new THREE.GridHelper(160,80,0x668e69,0x8cb08a);grid.position.y=.025;grid.material.transparent=true;grid.material.opacity=.16;scene.add(grid);
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),ground=new THREE.Plane(new THREE.Vector3(0,1,0),0),hit=new THREE.Vector3();
const placed=new Map();let active='camera',roadStart=null,roadPts=[],buildingCount=0;
const mat=(color,rough=.82)=>new THREE.MeshStandardMaterial({color,roughness:rough});
function makeBuilding(x,z,type){const key=x+','+z;if(placed.has(key))return;const group=new THREE.Group();let color=type==='res'?0xd8e4d6:type==='com'?0xd9bd78:0xb77e65;let w=type==='ind'?3.8:2.8,d=type==='ind'?4.2:2.8,h=type==='res'?3+Math.random()*6:type==='com'?5+Math.random()*9:3+Math.random()*4;
const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));body.position.y=h/2;body.castShadow=true;body.receiveShadow=true;group.add(body);
const roof=new THREE.Mesh(new THREE.BoxGeometry(w*1.03,.35,d*1.03),mat(type==='ind'?0x747c7c:0x596d75));roof.position.y=h+.12;group.add(roof);
if(type==='res'||type==='com'){for(let yy=1.2;yy<h-.5;yy+=1.5)for(let xx=-w/2+.55;xx<w/2;xx+=1.05){let win=new THREE.Mesh(new THREE.BoxGeometry(.42,.55,.06),new THREE.MeshStandardMaterial({color:0x8dc4d3,metalness:.25,roughness:.25}));win.position.set(xx,yy,d/2+.035);group.add(win)}}
group.position.set(x*4,0,z*4);scene.add(group);placed.set(key,group);buildingCount++}
function road(x1,z1,x2,z2){let a=new THREE.Vector3(x1*4,.12,z1*4),b=new THREE.Vector3(x2*4,.12,z2*4),dir=b.clone().sub(a),len=dir.length();if(len<1)return;let m=new THREE.Mesh(new THREE.BoxGeometry(3.2,.18,len),mat(0x424a50,.95));m.position.copy(a.add(b).multiplyScalar(.5));m.rotation.y=Math.atan2(dir.x,dir.z);m.receiveShadow=true;scene.add(m);let stripe=new THREE.Mesh(new THREE.BoxGeometry(.09,.02,len*.92),mat(0xd8c98a));stripe.position.set(m.position.x,.22,m.position.z);stripe.rotation.y=m.rotation.y;scene.add(stripe)}
function resize(){const r=host.getBoundingClientRect();camera.aspect=r.width/r.height;camera.updateProjectionMatrix();renderer.setSize(r.width,r.height,false)}new ResizeObserver(resize).observe(host);resize();
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.mode;roadStart=null}));
renderer.domElement.addEventListener('pointerdown',e=>{if(active==='camera')return;const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera);if(ray.ray.intersectPlane(ground,hit)){let x=Math.round(hit.x/4),z=Math.round(hit.z/4);if(active==='road'){if(!roadStart)roadStart={x,z};else{road(roadStart.x,roadStart.z,x,z);roadStart=null}}else if(['res','com','ind'].includes(active)){makeBuilding(x,z,active)}else if(active==='bulldoze'){const k=x+','+z;if(placed.has(k)){scene.remove(placed.get(k));placed.delete(k)}}document.getElementById('selection').textContent='3D座標 '+x+', '+z+' / 建物 '+buildingCount+'棟';document.getElementById('pop').textContent=(buildingCount*9).toLocaleString();document.getElementById('people').textContent=(buildingCount*9)+'人';document.getElementById('jobs').textContent=(buildingCount*5)}}});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();water.material.color.setHSL(.54,.48,.34+Math.sin(t*.45)*.015);controls.update();renderer.render(scene,camera)}animate();
</script></body></html>
