<header class="site-header"><div class="header-inner"><a class="home-brand" href="./" aria-label="理科キッズ ホーム"><div class="logo" aria-hidden="true">理</div><div class="brand">理科キッズ<small>SCIENCE KIDS</small></div></a><div class="header-tag">中学1〜3年生・理科用語集</div><a class="ranking-open" href="./ranking.html">🏆 ランキング</a><a class="ranking-open" href="./titles.html">🎖️ 称号一覧</a><button class="account-open" type="button" onclick="location.href='./profile.html'">ログイン・プロフィール</button></div></header>
<main>
<section class="hero"><div class="cup">🏆</div><h1>正解数ランキング</h1><p>みんなの累計正解数で競おう！</p></section>
<section class="panel"><div id="status" class="status">ランキングを読み込んでいます…</div><div id="list"></div></section>
<p class="foot">ランキングにはユーザー名と累計正解数が表示されます。<br>正解数はログイン中に正解した分が記録されます。</p>
<div id="updated" class="updated"></div>
<a class="back" href="https://shunshunday.github.io/science-study/">← 理科キッズに戻る</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const client=window.supabase.createClient("https://tmgfcmzufamxuzsuedza.supabase.co","sb_publishable_2hmdBWipev_2go57lH7wdA_fpHAP-Ng");
function titleFor(n){if(n>=1000)return "覇者";if(n>=500)return "ノーベル賞";if(n>=200)return "伝説の科学者";if(n>=100)return "科学の天才";if(n>=60)return "理科博士";if(n>=30)return "理科マスター";if(n>=10)return "理科チャレンジャー";return "理科ビギナー";}
function titleMarkFor(n){if(n>=1000)return "👑";if(n>=500)return "♛";if(n>=200)return "🌟";if(n>=100)return "💡";if(n>=60)return "🧪";if(n>=30)return "🔬";if(n>=10)return "⚗️";return "🌱";}
(async()=>{
 const status=document.getElementById("status"),list=document.getElementById("list");
 const {data,error}=await client.from("public_leaderboard").select("username,correct_count").order("correct_count",{ascending:false}).order("username",{ascending:true}).limit(100);
 if(error){status.textContent="ランキングを読み込めませんでした。時間をおいて再読み込みしてください。";return;}
 status.hidden=true;
 if(!data||data.length===0){status.hidden=false;status.textContent="まだランキングに参加している人はいません。";return;}
 data.forEach((item,i)=>{
  const row=document.createElement("div");row.className="row";
  const scoreValue=Number(item.correct_count||0);const isHaki=scoreValue>=1000;const isNobel=scoreValue>=500&&scoreValue<1000;if(isHaki)row.classList.add("haki-row");else if(isNobel)row.classList.add("nobel-row");
  const pos=document.createElement("div");pos.className="pos";pos.textContent=i===0?"🥇":i===1?"🥈":i===2?"🥉":String(i+1);
  const name=document.createElement("div");name.className="name";name.textContent=item.username;const mark=document.createElement("span");mark.className="title-mark";mark.textContent=titleMarkFor(Number(item.correct_count||0));name.appendChild(mark);
  const title=document.createElement("span");title.className="rank";title.textContent=titleFor(Number(item.correct_count||0));name.appendChild(title);
  const score=document.createElement("div");score.className="score";score.textContent=Number(item.correct_count||0).toLocaleString("ja-JP");
  const small=document.createElement("small");small.textContent="問正解";score.appendChild(small);
  row.append(pos,name,score);list.appendChild(row);
 });
 document.getElementById("updated").textContent="上位"+data.length+"人を表示";
})();
</script>
</body>
