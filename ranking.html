<section class="hero"><div class="cup">🏆</div><h1>資産ランキング</h1><p>みんなの都市の所持金で競おう！</p></section>
<section class="panel"><div id="status" class="status">ランキングを読み込んでいます…</div><div id="list"></div></section>
<p class="foot">ランキングは都市の所持金順です。クイズ正解で得た資金や、街づくりで使った資金・返金が反映されます。</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const client=window.supabase.createClient("https://tmgfcmzufamxuzsuedza.supabase.co","sb_publishable_2hmdBWipev_2go57lH7wdA_fpHAP-Ng");
window.rikakidsSupabaseClient=client;
function titleFor(n){if(n>=1000000)return "覇者";if(n>=500000)return "ノーベル賞";if(n>=200000)return "伝説の科学者";if(n>=100000)return "科学の天才";if(n>=60000)return "理科博士";if(n>=30000)return "理科マスター";if(n>=10000)return "理科チャレンジャー";return "理科ビギナー";}
function titleMarkFor(n){if(n>=1000000)return "";if(n>=500000)return "♛";if(n>=200000)return "🌟";if(n>=100000)return "💡";if(n>=60000)return "🧪";if(n>=30000)return "🔬";if(n>=10000)return "⚗️";return "🌱";}
(async()=>{
 const status=document.getElementById("status"),list=document.getElementById("list");
 const {data,error}=await client.from("public_leaderboard").select("username,balance,lifetime_earned").order("balance",{ascending:false}).order("username",{ascending:true}).limit(100);
 if(error){status.textContent="ランキングを読み込めませんでした。時間をおいて再読み込みしてください。";return;}
 let avatarByUsername={};
 try{const names=(data||[]).map(x=>x.username).filter(Boolean);if(names.length){const result=await client.from("profiles").select("username,avatar_url").in("username",names);if(!result.error){(result.data||[]).forEach(p=>{if(p.avatar_url)avatarByUsername[p.username]=p.avatar_url;});}}}catch(e){console.warn("プロフィール画像の取得をスキップしました",e);}
 status.hidden=true;
 if(!data||data.length===0){status.hidden=false;status.textContent="まだランキングに参加している人はいません。";return;}
 data.forEach((item,i)=>{
  const row=document.createElement("div");row.className="row";
  const scoreValue=Math.max(0,Number(item.balance)||0);const isHaki=scoreValue>=1000000;const isNobel=scoreValue>=500000&&scoreValue<1000000;if(isHaki)row.classList.add("haki-row");else if(isNobel)row.classList.add("nobel-row");
  const pos=document.createElement("div");pos.className="pos";pos.textContent=i===0?"🥇":i===1?"🥈":i===2?"🥉":String(i+1);
  const avatar=document.createElement("a");avatar.className="rank-avatar";avatar.href="./public-profile.html?user="+encodeURIComponent(item.username);avatar.style.textDecoration="none";avatar.style.color="inherit";avatar.setAttribute("aria-label",item.username+"のプロフィールを見る");avatar.textContent="理";if(avatarByUsername[item.username]){const img=document.createElement("img");img.src=avatarByUsername[item.username];img.alt="";img.loading="lazy";img.referrerPolicy="no-referrer";img.addEventListener("error",()=>{img.remove();avatar.textContent="理";},{once:true});avatar.textContent="";avatar.appendChild(img);}
  const name=document.createElement("a");name.className="name";name.href="./public-profile.html?user="+encodeURIComponent(item.username);name.textContent=item.username;name.style.color="inherit";name.style.textDecoration="none";name.title=item.username+"のプロフィールを見る";const mark=document.createElement("span");mark.className="title-mark";
  if(scoreValue>=1000000){mark.classList.add("haisha-crest");mark.setAttribute("aria-label","覇者の紋章");mark.innerHTML='<img src="./assets/haisha-crown.svg" alt="">';}
  else mark.textContent=titleMarkFor(scoreValue);
  name.appendChild(mark);
  const title=document.createElement("span");title.className="rank";title.textContent=titleFor(scoreValue);name.appendChild(title);
  const scores=document.createElement("div");scores.className="rank-assets";
  const score=document.createElement("div");score.className="score";score.textContent="$"+scoreValue.toLocaleString("en-US");
  const small=document.createElement("small");small.textContent="現在の資産";score.appendChild(small);
  const total=document.createElement("div");total.className="total-score";total.textContent="$"+Math.max(0,Number(item.lifetime_earned)||0).toLocaleString("en-US");
  const totalSmall=document.createElement("small");totalSmall.textContent="総資産";total.appendChild(totalSmall);
  scores.append(score,total);
  row.append(pos,avatar,name,scores);list.appendChild(row);
 });
 document.getElementById("updated").textContent="上位"+data.length+"人を表示";
})();
</script>
