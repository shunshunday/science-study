<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16834a">
<title>ランキング｜理科キッズ</title>
<style>
:root{--green:#16834a;--ink:#203128;--muted:#718077;--line:#e2ebe4}
*{box-sizing:border-box}body{margin:0;background:#f4f8f5;color:var(--ink);font-family:"Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line)}.home-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}.head{max-width:850px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;display:grid;place-items:center;background:#168b4c;color:#fff;border-radius:7px;font-size:25px;font-weight:900}.brand{font-weight:900;font-size:19px}main{width:min(100% - 30px,760px);margin:28px auto 60px}.hero{background:linear-gradient(120deg,#123b27,#1b7544);color:#fff;border-radius:18px;padding:26px;text-align:center}.hero .cup{font-size:42px}.hero h1{margin:4px 0;font-size:27px}.hero p{margin:5px 0 0;color:#d7e9dc;font-size:13px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;margin-top:18px;padding:16px;box-shadow:0 8px 25px #153d2508}.row{display:flex;align-items:center;gap:12px;padding:13px 8px;border-bottom:1px solid #edf1ee}.row:last-child{border-bottom:0}.row.nobel-row{margin:8px 0;padding:17px 12px;border:1px solid #c8a44e;border-radius:13px;background:linear-gradient(110deg,#fff8df,#f5e7bd 48%,#fffaf0);box-shadow:0 5px 18px #9c77251c}.row.nobel-row .name{color:#6d4d12}.row.nobel-row .rank{color:#987020}.row.nobel-row .score{color:#916719}.nobel-crown{display:inline-block;margin-right:5px;color:#a57b27}.pos{width:34px;flex:none;text-align:center;font-weight:900;color:#65756a;font-size:17px}.medal{font-size:24px}.name{min-width:0;flex:1;font-weight:850;overflow-wrap:anywhere}.rank{display:block;color:#8b7130;font-size:11px;font-weight:750;margin-top:2px}.score{text-align:right;white-space:nowrap;font-weight:900;color:var(--green)}.score small{display:block;color:#7b887f;font-size:10px;font-weight:600}.status{text-align:center;color:var(--muted);padding:24px 8px;font-size:13px}.foot{text-align:center;color:#78857c;font-size:11px;line-height:1.7;margin:16px 8px}.back{display:block;text-align:center;margin:18px auto;color:#28613d;font-weight:800;text-decoration:none;font-size:13px}.updated{text-align:center;color:#7b887f;font-size:11px;margin-top:10px}
</style>
</head>
<body>
<header><div class="head"><a class="home-brand" href="https://shunshunday.github.io/science-study/" aria-label="理科キッズ ホーム"><div class="logo">理</div><div class="brand">理科キッズ</div></a><a href="./titles.html" style="margin-left:auto;color:#28613d;font-size:12px;font-weight:800;text-decoration:none">🎖️ 称号一覧</a></div></header>
<main>
<section class="hero"><div class="cup">🏆</div><h1>正解数ランキング</h1><p>みんなの累計正解数で競おう！</p></section>
<section class="panel"><div id="status" class="status">ランキングを読み込んでいます…</div><div id="list"></div></section>
<p class="foot">ランキングにはユーザー名と累計正解数が表示されます。<br>正解数はログイン中に正解した分が記録されます。</p>
<div id="updated" class="updated"></div>
<a class="back" href="https://shunshunday.github.io/science-study/">← 理科キッズに戻る</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const client=window.supabase.createClient("https://tmgfcmzufamxuzsuedza.supabase.co","sb_publishable_2hmdBWipev_2go57lH7wdA_fpHAP-Ng");
function titleFor(n){if(n>=500)return "ノーベル賞";if(n>=200)return "伝説の科学者";if(n>=100)return "科学の天才";if(n>=60)return "理科博士";if(n>=30)return "理科マスター";if(n>=10)return "理科チャレンジャー";return "理科ビギナー";}
(async()=>{
 const status=document.getElementById("status"),list=document.getElementById("list");
 const {data,error}=await client.from("public_leaderboard").select("username,correct_count").order("correct_count",{ascending:false}).order("username",{ascending:true}).limit(100);
 if(error){status.textContent="ランキングを読み込めませんでした。時間をおいて再読み込みしてください。";return;}
 status.hidden=true;
 if(!data||data.length===0){status.hidden=false;status.textContent="まだランキングに参加している人はいません。";return;}
 data.forEach((item,i)=>{
  const row=document.createElement("div");row.className="row";
  const isNobel=Number(item.correct_count||0)>=500;if(isNobel)row.classList.add("nobel-row");
  const pos=document.createElement("div");pos.className="pos";pos.textContent=i===0?"🥇":i===1?"🥈":i===2?"🥉":String(i+1);
  const name=document.createElement("div");name.className="name";name.textContent=item.username;if(isNobel){const crown=document.createElement("span");crown.className="nobel-crown";crown.textContent="♛";name.appendChild(crown);}
  const title=document.createElement("span");title.className="rank";title.textContent=titleFor(Number(item.correct_count||0))+(isNobel?"　✦ NOBEL LAUREATE ✦":"");name.appendChild(title);
  const score=document.createElement("div");score.className="score";score.textContent=Number(item.correct_count||0).toLocaleString("ja-JP");
  const small=document.createElement("small");small.textContent="正解";score.appendChild(small);
  row.append(pos,name,score);list.appendChild(row);
 });
 document.getElementById("updated").textContent="上位"+data.length+"人を表示";
})();
</script>
</body>
</html>
