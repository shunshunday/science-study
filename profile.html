<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16834a">
<meta name="robots" content="noindex,follow">
<title>アカウント設定｜理科キッズ</title>
<style>
:root{--green:#16834a;--ink:#203128;--muted:#69776e;--line:#e2ebe4;--red:#b83232}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#fff8df 0,transparent 34%),#f4f8f5;color:var(--ink);font-family:"Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif;padding:28px 16px}
main{width:min(100%,620px);margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(20px,5vw,34px);box-shadow:0 12px 35px #153d2510}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;margin-bottom:24px;color:inherit;text-decoration:none}
.logo{width:42px;height:42px;display:grid;place-items:center;background:var(--green);color:#fff;border-radius:8px;font-size:27px}
h1{font-size:25px;margin:0 0 6px}.lead{font-size:13px;color:var(--muted);margin:0 0 22px}
.panel{border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}
.panel h2{font-size:16px;margin:0 0 13px}
.user{background:#f3f8f4;padding:14px;border-radius:10px;margin-bottom:12px}.user strong{font-size:18px}
.score{padding:17px;background:#edf7ef;border:1px solid #dceee1;border-radius:11px;text-align:center}
.score strong{display:block;font-size:38px;line-height:1.2;color:var(--green)}.score span{font-size:12px;font-weight:800;color:#486451}
.rank{margin-top:10px;padding:12px;border:1px solid #e8dfb8;background:#fffaf0;border-radius:10px;text-align:center}
.rank span{display:block;color:#8a7131;font-size:11px;font-weight:800}.rank strong{display:block;color:#6e5316;font-size:18px;margin-top:3px}
label{display:block;font-size:12px;font-weight:800;margin:12px 0 6px}
input{width:100%;height:44px;border:1px solid #dce6df;border-radius:9px;padding:0 12px;font:inherit;font-size:14px;outline:none}
input:focus{border-color:var(--green);box-shadow:0 0 0 3px #168b4a18}
button,a.action{display:block;width:100%;text-align:center;border:0;border-radius:9px;padding:12px;margin-top:12px;font:inherit;font-size:13px;font-weight:850;text-decoration:none;cursor:pointer}
.primary{background:var(--green);color:#fff}.secondary{background:#eef5f0;color:#28613d}
.danger-panel{border-color:#f0d8d8;background:#fffdfd}.danger-panel h2{color:var(--red)}
.danger-button{background:var(--red);color:white}.warning{font-size:12px;line-height:1.7;color:#8a4444;margin:0}
#status,#passwordMessage,#deleteMessage{font-size:12px;text-align:center;color:var(--muted);margin:12px 0 0;min-height:18px}
#profile[hidden]{display:none}
button:disabled{opacity:.55;cursor:wait}
</style>
</head>
<body>
<main>
 <a class="brand" href="./" aria-label="理科キッズ ホーム"><span class="logo">理</span><span>理科キッズ</span></a>
 <h1>アカウント設定</h1>
 <p class="lead">プロフィールの確認、パスワードの変更、アカウントの削除ができます。</p>
 <p id="status">ログイン状態を確認しています…</p>
 <section id="profile" hidden>
  <div class="panel">
   <h2>プロフィール</h2>
   <div class="user"><strong id="username"></strong><div>理科キッズ メンバー</div></div>
   <div class="score"><strong id="correct">0</strong><span>累計正解数</span></div>
   <div class="rank"><span>現在の称号</span><strong id="rank">理科ビギナー</strong></div>
   <a class="action secondary" href="./titles.html">称号の条件・一覧を見る</a>
  </div>
  <form class="panel" id="passwordForm">
   <h2>パスワードの変更</h2>
   <label for="currentPassword">現在のパスワード</label>
   <input id="currentPassword" type="password" autocomplete="current-password" required>
   <label for="newPassword">新しいパスワード（8文字以上）</label>
   <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
   <label for="confirmPassword">新しいパスワード（確認）</label>
   <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
   <button class="primary" id="passwordButton" type="submit">パスワードを変更</button>
   <p id="passwordMessage" role="status"></p>
  </form>
  <section class="panel danger-panel">
   <h2>アカウント削除</h2>
   <p class="warning">アカウントを削除すると、プロフィール・累計正解数・ランキング情報・学習履歴が削除されます。この操作は取り消せません。</p>
   <label for="deletePassword">本人確認のため、現在のパスワードを入力</label>
   <input id="deletePassword" type="password" autocomplete="current-password">
   <label for="deleteConfirm">確認のため「削除する」と入力</label>
   <input id="deleteConfirm" type="text" autocomplete="off" placeholder="削除する">
   <button class="danger-button" id="deleteButton" type="button">アカウントを完全に削除</button>
   <p id="deleteMessage" role="status"></p>
  </section>
  <button class="secondary" id="logout" type="button">ログアウト</button>
  <a class="action secondary" href="./">理科キッズに戻る</a>
 </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2';"></script>
<script>
let supabase=null;
const statusElement=document.getElementById("status");
try{
 if(!window.supabase?.createClient)throw new Error("認証ライブラリを読み込めませんでした。");
 supabase=window.supabase.createClient("https://tmgfcmzufamxuzsuedza.supabase.co","sb_publishable_2hmdBWipev_2go57lH7wdA_fpHAP-Ng");
}catch(initError){
 statusElement.textContent="認証システムを読み込めませんでした。ページを再読み込みしてください。";
 console.error("Supabase client initialization failed:",initError);
}
let currentUser=null;
function titleFor(n){if(n>=1000)return "覇者";if(n>=500)return "ノーベル賞";if(n>=200)return "伝説の科学者";if(n>=100)return "科学の天才";if(n>=60)return "理科博士";if(n>=30)return "理科マスター";if(n>=10)return "理科チャレンジャー";return "理科ビギナー";}
function withTimeout(promise,ms){
 return Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error("接続がタイムアウトしました。通信環境を確認して再読み込みしてください。")),ms))]);
}
async function refreshProfile(){
 statusElement.hidden=false;
 statusElement.textContent="ログイン状態を確認しています…";
 if(!supabase){statusElement.textContent="認証システムを読み込めませんでした。ページを再読み込みしてください。";return;}
 try{
  const {data:{session},error:sessionError}=await withTimeout(supabase.auth.getSession(),12000);
  if(sessionError)throw sessionError;
  if(!session?.user){location.replace("./?login=1");return;}
  currentUser=session.user;
  const {data,error}=await withTimeout(supabase.from("profiles").select("username,correct_count").eq("id",currentUser.id).single(),12000);
  if(error)throw error;
  if(!data)throw new Error("プロフィール情報が見つかりません。");
  document.getElementById("username").textContent=data.username||"ユーザー";
  const count=Number(data.correct_count||0);
  document.getElementById("correct").textContent=count.toLocaleString("ja-JP");
  document.getElementById("rank").textContent=titleFor(count);
  statusElement.hidden=true;
  document.getElementById("profile").hidden=false;
 }catch(error){
  console.error("Profile loading failed:",error);
  statusElement.textContent=error.message||"読み込みに失敗しました。ページを再読み込みしてください。";
 }
}
document.getElementById("passwordForm").addEventListener("submit",async e=>{
 if(!supabase||!currentUser){document.getElementById("passwordMessage").textContent="ログイン状態を確認できません。再読み込みしてください。";return;}
 e.preventDefault();
 const current=document.getElementById("currentPassword").value;
 const next=document.getElementById("newPassword").value;
 const confirm=document.getElementById("confirmPassword").value;
 const message=document.getElementById("passwordMessage");
 const button=document.getElementById("passwordButton");
 if(next.length<8){message.textContent="新しいパスワードは8文字以上にしてください。";return;}
 if(next!==confirm){message.textContent="新しいパスワードが一致しません。";return;}
 if(next===current){message.textContent="現在と異なるパスワードを設定してください。";return;}
 button.disabled=true;message.textContent="本人確認中…";
 try{
  const {error:loginError}=await supabase.auth.signInWithPassword({email:currentUser.email,password:current});
  if(loginError)throw new Error("現在のパスワードが正しくありません。");
  const {error}=await supabase.auth.updateUser({password:next});
  if(error)throw error;
  e.target.reset();message.textContent="パスワードを変更しました。";
 }catch(err){message.textContent=err.message||"変更できませんでした。";}
 finally{button.disabled=false;}
});
document.getElementById("deleteButton").addEventListener("click",async()=>{
 if(!supabase||!currentUser){document.getElementById("deleteMessage").textContent="ログイン状態を確認できません。再読み込みしてください。";return;}
 const password=document.getElementById("deletePassword").value;
 const confirmation=document.getElementById("deleteConfirm").value.trim();
 const message=document.getElementById("deleteMessage");
 const button=document.getElementById("deleteButton");
 if(!password){message.textContent="現在のパスワードを入力してください。";return;}
 if(confirmation!=="削除する"){message.textContent="確認欄に「削除する」と正確に入力してください。";return;}
 if(!confirm("本当にアカウントを削除しますか？この操作は取り消せません。"))return;
 button.disabled=true;message.textContent="本人確認中…";
 try{
  const {error:loginError}=await supabase.auth.signInWithPassword({email:currentUser.email,password});
  if(loginError)throw new Error("現在のパスワードが正しくありません。");
  message.textContent="アカウントを削除しています…";
  const {data,error}=await supabase.functions.invoke("delete-account",{body:{}});
  if(error)throw error;
  if(!data?.success)throw new Error(data?.error||"削除できませんでした。");
  await supabase.auth.signOut();
  alert("アカウントを削除しました。ご利用ありがとうございました。");
  location.replace("./");
 }catch(err){message.textContent=err.message||"削除できませんでした。もう一度お試しください。";button.disabled=false;}
});
document.getElementById("logout").addEventListener("click",async()=>{if(!supabase)return;await supabase.auth.signOut();location.replace("./");});
refreshProfile();
</script>
</body>
</html>
